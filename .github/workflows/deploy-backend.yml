name: Deploy Backend to VPS

on:
  push:
    branches:
      - master
    paths:
      - 'coinclash-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 10077
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.VPS_TARGET_DIR }}

      - name: Sync backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 10077
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "coinclash-backend"
          target: ${{ secrets.VPS_TARGET_DIR }}
          exclude: |
            .git/**
            .github/**

      - name: Rebuild and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 10077
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_TARGET_DIR }}/coinclash-backend
            echo "=== Starting backend deployment ==="
            touch .env
            sed -i '/^PAYSTACK_SECRET_KEY=/d' .env
            echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}" >> .env
            echo "Building Docker image..."
            docker compose build
            echo "Starting containers..."
            docker compose up -d
            echo "Checking container status..."
            docker compose ps
            echo "=== Deployment completed successfully ==="
